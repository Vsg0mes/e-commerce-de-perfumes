events {
    worker_connections 1024;
}

http {
    # Usa o resolver DNS interno do Docker para resolução dinâmica
    # Necessário quando os upstreams podem não estar prontos no momento do start do nginx
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Backend API
        location /api/ {
            set $backend_upstream http://backend:3333;
            proxy_pass $backend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploads estáticos servidos pelo backend
        location /uploads/ {
            set $backend_upstream http://backend:3333;
            proxy_pass $backend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (inclui WebSocket para HMR do Vite em dev)
        location / {
            set $frontend_upstream http://frontend:5173;
            proxy_pass $frontend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Suporte a WebSocket (necessário para HMR do Vite)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
