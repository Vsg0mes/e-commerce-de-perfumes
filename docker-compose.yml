services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    expose:
      - "3333"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?schema=public
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - PORT=3333
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-placeholder}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8080}
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    expose:
      - "5173"
    environment:
      - VITE_API_URL=/api
      - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # Encaminha webhooks da Stripe (modo teste) para o backend. Só sobe com: --profile stripe
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    command: listen --events payment_intent.succeeded,payment_intent.payment_failed --api-key ${STRIPE_SECRET_KEY} --forward-to http://backend:3333/api/payments/webhook
    depends_on:
      - backend

volumes:
  postgres_data:
